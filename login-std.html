<body>
   <div class="landing-page">

    <div class="header-landing">

      <div class="top-header">
  <div class="container d-flex flex-wrap justify-content-between align-items-center ">
    
    
    <div class="d-flex gap-3 flex-wrap">
      <span class="info-item-location"> فلسطين - غزة <i class="fas fa-map-marker-alt"></i></span>
      
      <span class="info-item-hour"> من 8:00 ص - 3:00 م <i class="fas fa-clock"></i> </span>
    </div>
    <div class="d-flex gap-3">
      <span class="contact-item-email"> sparkEducation.edu <i class="fas fa-envelope"></i></span>
      <span class="contact-item-phone"> 0598765432234 <i class="fas fa-phone"></i></span>
    </div>
  </div>
</div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg main-navbar">
  <div class="container">
     <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="images/spark.png" alt="Logo">
    </a>


    <div class="navbar-collapse-item" id="mainNavbar">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>

  </div>
</nav>
    </div>

      <section class="login">
        <div class="login-container">
           
            <div class="right-section">
                <div class="login-box">
                    <form id="stdForm" class="custom-form" style="display: block;">
                        <h2>تسجيل دخول <span>الطالب</span></h2>
                        <input type="text" placeholder="ادخل رقم الهوية *" class="input-box-custom">
                        <input type="password" placeholder="ادخل كلمة المرور *" class="input-box-custom2">
                        <button class="login-btn-custom">تسجيل الدخول</button>
                    </form>

                    <form id="parentForm" class="custom-form" style="display: none;">
                        <h2>تسجيل دخول <span>ولي الأمر</span></h2>
                        <input type="text" placeholder="ادخل رقم الهوية *" class="input-box-custom">
                        <input type="password" placeholder="ادخل كلمة المرور *" class="input-box-custom2">
                        <button class="login-btn-custom">تسجيل الدخول</button>
                    </form>

                    <div class="icons">
                        <a href="#" class="login-icon" id="icon-std"  onclick="showForm('student',this)"><img src="images/std-on.png" alt="Student" title="تسجيل دخول الطالب"></a>
                        <a href="#" class="login-icon" id="icon-parent" onclick="showForm('parent', this)"><img src="images/par-off.png" alt="Parent" title="تسجيل دخول ولي الامر"></a>

                    </div>
                </div>
            </div>

            <div class="left-section">
                <div class="image-container">
                    <img src="images/child.webp" alt="Student Image" class="student-img">
                </div>
            </div>
        </div>

    </section>

  </div>
